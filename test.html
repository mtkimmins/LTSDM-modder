<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="file" id="wav-file" accept=".wav">
    <script type="module">
        import init, { encode_pcm} from './web/a1800/pkg/a1800.js';

        await init();
        console.log('WASM loaded');

        //Sine test
        const pcm = new Int16Array(16000);
        for (let i = 0; i < 16000; i++) {
            pcm[i] = Math.round(10000 * Math.sin(2 * Math.PI * 440 * i / 16000));
        }

        const out = encode_pcm(pcm);
        console.log('Sine test bytes:', out.length, '(expect 2006)');

        const frameBytes = out[0] | (out[1] << 8) | (out[2] << 16) | (out[3] << 24);
        const bitrate = out[4] | (out[5] << 8);
        console.log('Header frame bytes:', frameBytes, 'bitrate:', bitrate);

        //Real converter
        const fileInput = document.getElementById("wav-file");
        fileInput.addEventListener("change", async () => {
            const file = fileInput.files[0];
            const buffer = await file.arrayBuffer();
            const pcm = new Int16Array(buffer.slice(44));
            console.log('PCM samples:', pcm.length, 'file bytes:', file.size);
            const out = encode_pcm(pcm);
            console.log('Encoded bytes:', out.length);

            const blob = new Blob([out], { type: 'application/octet-stream' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = file.name.replace(/\.wav$/i, '.a18');
            a.click();
        });
    </script>
</body>
</html>
